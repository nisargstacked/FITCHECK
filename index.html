<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY STORES</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #2b2b2b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #90caf9;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        #store-list {
            list-style: none;
            padding: 0;
        }
        .store-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            margin-bottom: 10px;
            background-color: #3a3a3a;
            border: 1px solid #4f4f4f;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
        }
        .store-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            background-color: #4a4a4a;
        }
        .store-item.has-cart {
            border: 2px solid #ffeb3b;
            box-shadow: 0 0 10px #ffeb3b40;
        }
        .store-link {
            text-decoration: none;
            color: #e0e0e0;
            font-size: 1.1em;
            font-weight: 600;
            flex-grow: 1;
        }
        .store-link:hover {
            color: #90caf9;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-left: 15px;
        }
        .action-btn {
            background-color: #555;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            line-height: 1;
            transition: background-color 0.2s, color 0.2s;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .action-btn:hover {
            background-color: #777;
        }
        .favorite-btn::before {
            content: '⭐';
        }
        .favorite-btn.is-favorite {
            background-color: #e91e63;
        }
        .favorite-btn.is-favorite:hover {
            background-color: #c2185b;
        }
        .favorite-btn.is-favorite::before {
            content: '❤️';
        }
        .cart-btn::before {
            content: '🛒';
        }
        .cart-btn.has-cart {
            background-color: #ff9800;
            color: black;
        }
        .cart-btn.has-cart:hover {
            background-color: #fb8c00;
        }
        .cart-btn.has-cart::before {
            content: '✅';
        }
        .store-item.is-favorite {
            order: -1;
            background-color: #3a3a3a;
            border-color: #4f4f4f;
            box-shadow: none;
        }
        .store-item.has-cart {
            order: -2;
            background-color: #44443a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>FITCHECK</h1>
        <ul id="store-list">

        </ul>
    </div>

    <script>
        const storeData = [
            { id: 'badandboujeeindia', name: 'Bad and Boujee India', url: 'https://badandboujee.in' },
            { id: 'berksha', name: 'Berksha', url: 'https://www.bershka.com' },
            { id: 'beseksy', name: 'Beseksy', url: 'https://beseksy.in/' },
            { id: 'blurgvillage', name: 'BlurgVillage', url: 'https://blurgvillage.com/' },
            { id: 'bonkerscorner', name: 'Bonkers Corner', url: 'https://www.bonkerscorner.com/' },
            { id: 'cannac', name: 'Cannac', url: 'https://cannac.in' },
            { id: 'crazzyheads', name: 'Crayy Heads', url: 'https://crayyheads.com' },  
            { id: 'enzemble', name: 'Enzemble', url: 'https://enzemble.in' },
            { id: 'dap drip monkey', name: 'Dap Drip Monkey', url: 'https://dapdripmonkey.com' },
            { id: 'dlstreet', name: 'DL Street', url: 'https://thedlstreet.com/' },
            { id: 'fadl', name: 'FADL', url: 'https://fadl.in' },
            { id: 'Grindoverdreams', name: 'GrindOverDreams', url: 'https://grindoverdreams.in/' },
            { id: 'H&M', name: 'H&M', url: 'https://www2.hm.com' },          
            { id: 'madebycltrshirts', name: 'Made by CLTR Shirts', url: 'https://cltrshop.in/collections/bowling-shirts' },
            { id: 'maincharacterindia', name: 'Main Character India', url: 'https://www.maincharacterindia.com' },
            { id: 'midhours', name: 'Midhours', url: 'https://midhours.com' },
            { id: 'ogfr', name: 'OG For Real', url: 'https://ogforreal.com' },
            { id: 'shopfootball', name: 'Shop Football', url: 'https://shopfootball.in' },
            { id: 'six5sixstreet', name: 'Six5Six Street', url: 'https://www.six5sixstreet.com' },
            { id: 'snitch', name: 'Snitch', url: 'https://www.snitch.com/' },
            { id: 'sohstore', name: 'SOH Stores', url: 'https://sohstores.com' },
            { id: 'stooky', name: 'Stooky', url: 'https://stooky.in' },
            { id: 'untld', name: 'UNTLD Blank', url: 'https://untld.in' },
            { id: 'wearadhd', name: 'Wear ADHD', url: 'https://wearadhd.com' },
            { id: 'wtfit', name: 'WTFIT', url: 'https://wtfit.in' },
            { id: 'wtflex', name: 'WTFLEX', url: 'https://wtflex.in' },
            { id: 'youngwear', name: 'Young Wear', url: 'https://www.youngwear.in' }
        ];

        const list = document.getElementById('store-list');
        const FAV_STORAGE_KEY = 'favoriteStores';
        const CART_STORAGE_KEY = 'cartStores';

        function getItems(key) {
            const items = localStorage.getItem(key);
            return items ? JSON.parse(items) : {};
        }

        function saveItems(key, items) {
            localStorage.setItem(key, JSON.stringify(items));
        }

        function renderList() {
            const favorites = getItems(FAV_STORAGE_KEY);
            const carts = getItems(CART_STORAGE_KEY);

            const sortedStores = storeData.sort((a, b) => {
                const isACart = carts[a.id];
                const isBCart = carts[b.id];
                const isAFav = favorites[a.id];
                const isBFav = favorites[b.id];

                if (isACart && !isBCart) return -1;
                if (!isACart && isBCart) return 1;

                if (isAFav && !isBFav) return -1;
                if (!isAFav && isBFav) return 1;

                return a.name.localeCompare(b.name);
            });

            list.innerHTML = '';

            sortedStores.forEach(store => {
                const isFavorite = favorites[store.id];
                const isInCart = carts[store.id];

                const li = document.createElement('li');
                li.className = 'store-item' + (isFavorite ? ' is-favorite' : '') + (isInCart ? ' has-cart' : '');
                li.setAttribute('data-id', store.id);

                const link = document.createElement('a');
                link.className = 'store-link';
                link.href = store.url;
                link.target = '_blank';
                link.textContent = store.name;
                
                const buttonGroup = document.createElement('div');
                buttonGroup.className = 'button-group';

                const cartButton = document.createElement('button');
                cartButton.className = 'action-btn cart-btn' + (isInCart ? ' has-cart' : '');
                cartButton.addEventListener('click', () => toggleItem(store.id, CART_STORAGE_KEY));

                const favoriteButton = document.createElement('button');
                favoriteButton.className = 'action-btn favorite-btn' + (isFavorite ? ' is-favorite' : '');
                favoriteButton.addEventListener('click', () => toggleItem(store.id, FAV_STORAGE_KEY));

                buttonGroup.appendChild(cartButton);
                buttonGroup.appendChild(favoriteButton);

                li.appendChild(link);
                li.appendChild(buttonGroup);
                list.appendChild(li);
            });
        }

        function toggleItem(storeId, key) {
            const items = getItems(key);
            if (items[storeId]) {
                delete items[storeId];
            } else {
                items[storeId] = true;
            }
            saveItems(key, items);
            renderList();
        }

        document.addEventListener('DOMContentLoaded', renderList);
    </script>

</body>
</html>
